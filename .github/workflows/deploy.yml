name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
    inputs:
      full_browser:
        description: Run the complete browser regression suite
        type: boolean
        default: true
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  logic:
    name: Game logic (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --config=playwright.precommit.config.js --project=logic --workers=4 --shard=${{ matrix.shard }}/2
        env:
          RELATED_LOGIC_ONLY: '1'
  test:
    name: Browser checks (${{ matrix.shard }}/6)
    # Keep browser system dependencies on Playwright's supported Ubuntu release.
    runs-on: ubuntu-24.04
    # Shards hold different mixes of long real-time cases; leave headroom so
    # a slow shard reports its results instead of being cancelled.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Six shards keep a full regression under ten minutes of wall time.
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-ci-browser.mjs
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FULL_BROWSER: ${{ github.event_name == 'schedule' || inputs.full_browser == true }}
          CI_SHARD: ${{ matrix.shard }}/6
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-desktop-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
  deploy:
    needs: [logic, test]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
